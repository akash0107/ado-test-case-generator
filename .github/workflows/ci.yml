name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all scripts
        run: python -m compileall -q .claude/skills/manual-test-case-generator/scripts tests

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate bundled example and sample output
        run: |
          python .claude/skills/manual-test-case-generator/scripts/export_test_cases.py \
            .claude/skills/manual-test-case-generator/assets/example-test-cases.json --validate-only
          python .claude/skills/manual-test-case-generator/scripts/export_test_cases.py \
            examples/swag-labs-login/test-cases.json --validate-only
